name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r backend/requirements.lock
      - name: Tests must pass before anything is published
        run: |
          python -I -m unittest discover -s tests
          node --test --test-isolation=none "tests/*.test.js"

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Tag must match the extension and helper versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ext=$(node -p "require('./extension/manifest.json').version")
          helper=$(grep -oP 'BACKEND_VERSION = "\K[^"]+' backend/host.py)
          test "$tag" = "$ext" && test "$tag" = "$helper" || { echo "tag $tag, extension $ext, helper $helper"; exit 1; }
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "CHANGELOG.md has no entry for $tag"; exit 1; }
      - name: Build packages
        run: node tools/build.js --release
      - name: Prepare release draft for signing and review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          cd dist
          sha256sum "tomo-firefox-$ver.zip" "tomo-chrome-$ver.zip" "tomo-source-$ver.zip" > SHA256SUMS
          notes=$(awk -v v="$ver" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' ../CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" "tomo-firefox-$ver.zip" "tomo-chrome-$ver.zip" "tomo-source-$ver.zip" SHA256SUMS --draft --title "Tomo $ver" --notes "$notes"
